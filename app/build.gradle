plugins {
    id "com.android.application"
}

// Signing material lives OUTSIDE this repository, beside the other UU Labs
// keys, so it can never be committed. Point UU_DOOMSCROLLER_KEYSTORE at the
// properties file to use another location; without it a release build simply
// comes out unsigned rather than failing.
def signingPropsFile = new File(
        System.getenv("UU_DOOMSCROLLER_KEYSTORE")
                ?: "${System.properties['user.home']}/Work/Codex/UULabs/UULabsKeys/Doomscroller/keystore.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace "au.com.uulabs.doomscroller"
    compileSdk 36

    defaultConfig {
        applicationId "au.com.uulabs.doomscroller"
        minSdk 26
        targetSdk 35
        versionCode 57
        versionName "0.1.56"
        // A build made with -PdoomTrace=true logs the feed's decisions to logcat
        // under the tag "Doom", for diagnosing a phone that is not debuggable.
        // Published builds are made without it and stay silent.
        buildConfigField "boolean", "TRACE", project.hasProperty("doomTrace") ? "true" : "false"
    }

    // Two distributions from one codebase. `standard` never installs anything
    // by itself; `selfupdate` downloads and launches an installer, which is the
    // behaviour Play Protect flags as a dropper. Neither is distributed through
    // Google Play.
    flavorDimensions += "distribution"
    productFlavors {
        standard {
            dimension "distribution"
            buildConfigField "boolean", "SELF_UPDATE", "false"
        }
        selfupdate {
            dimension "distribution"
            buildConfigField "boolean", "SELF_UPDATE", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (signingPropsFile.exists()) {
            release {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    implementation "androidx.core:core:1.13.1"
}
